# ============================================================================
# Super Note — Docker Compose
# ----------------------------------------------------------------------------
# 默认（core）：仅笔记服务本体，无需 Redis / Ollama / OpenList。
# 可选能力通过 profile 启用：
#
#   docker compose up -d                              # 仅 core
#   docker compose --profile ai up -d                 # + Redis + Ollama
#   docker compose --profile media up -d              # + OpenList
#   docker compose --profile full up -d               # 全家桶
#
# 多实例 / 跨进程广播与 AI 异步队列需要 Redis 时，请显式设置：
#   REDIS_URL=redis://redis:6379
# 并启用 ai 或 full profile。
# ============================================================================

services:
  super-note:
    build:
      context: .
      dockerfile: Dockerfile
      # 在 x86 主机上可以通过以下命令构建 arm64 镜像（A311D/RK3566 等板子）：
      #   docker buildx build --platform linux/arm64 -t super-note:arm64 --load .
      # 或直接使用统一脚本：scripts/release.sh --build-only --arch arm64
      # compose 原生的 `platforms:` 字段在非 buildx 流程下会被忽略，这里仅做声明。
      platforms:
        - linux/amd64
        - linux/arm64
      # 构建参数（中国大陆用户取消下方注释以加速构建）：
      # args:
      #   DOCKER_REGISTRY: docker.m.daocloud.io/
      #   APK_MIRROR: mirrors.ustc.edu.cn
      #   NPM_REGISTRY: https://registry.npmmirror.com
    image: super-note:latest
    # 若在 x86 主机上拉起 arm64 镜像做冒烟测试，取消下一行注释（需已启用 binfmt/qemu）：
    # platform: linux/arm64
    container_name: super-note
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./super-note-data:/app/data

      # ===========================================================================
      # 【强烈建议】把备份目录挂载到与数据卷**不同的物理介质**上！
      #
      # 默认情况下备份会写入 /app/data/backups（即 super-note-data 卷内部），
      # 一旦该卷损坏 / 误删 / 被勒索，数据和备份会一起没。这违反 3-2-1 备份原则
      # （3 份副本、2 种介质、1 份异地）。
      #
      # 推荐做法（任选其一）：
      #   1) 绑定挂载到宿主机另一块磁盘：
      #        - /mnt/backup-disk/super-note:/app/backups
      #      然后在 environment 区块设置 BACKUP_DIR=/app/backups
      #   2) 挂载到 NAS / 网络存储路径
      #   3) 创建独立的 docker volume（虽然仍可能在同一物理盘，但至少防 down -v 误删）：
      #        - super-note-backup:/app/backups
      #
      # /api/backups/status 会返回 sameVolume=true/false，前端备份页会显示警告横幅。
      # ---------------------------------------------------------------------------
      # 取消下一行注释启用独立备份卷（任选 1/2/3 之一即可）：
      #- super-note-backup:/app/backups
    # JWT_SECRET 等敏感变量由容器内 docker-entrypoint.sh 在首启时自动生成并
    # 持久化到 data 卷；用户零配置即可启动。
    # 如需手动覆盖（多实例共享密钥、企业统一密钥管理等），可在同目录下创建
    # .env 文件填入 JWT_SECRET=... ，compose 会自动加载。.env 不存在则跳过。
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/super-note.db
      - PORT=3001
      - NODE_OPTIONS=--max-old-space-size=768
      # CORS 白名单（逗号分隔完整 origin）。跨域前端 / 移动端 WebView 必填。
      # - ALLOWED_ORIGINS=https://note.example.com,http://localhost:5173
      # 启用上面的独立备份卷后，**必须**同步设置以下变量，否则备份仍会写到 data 卷：
      #- BACKUP_DIR=/app/backups
      # --- 可选能力（启用对应 profile 时取消注释或写入 .env）---
      # AI / 多实例：需要 redis + 可选 ollama
      # - REDIS_URL=redis://redis:6379
      # - OLLAMA_URL=http://ollama:11434
      # 媒体库：需要 openlist
      # - OPENLIST_URL=http://openlist:5244
      # - MEDIA_STORAGE_URL=http://openlist:5244
      # - OPENLIST_TOKEN=
      # - MEDIA_STORAGE_TOKEN=
      # 通过环境变量透传（用户在 .env 里配置时生效；未设则后端走 memory Redis / 无 Ollama）
      - REDIS_URL=${REDIS_URL:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OPENLIST_URL=${OPENLIST_URL:-}
      - MEDIA_STORAGE_URL=${MEDIA_STORAGE_URL:-}
      - OPENLIST_TOKEN=${OPENLIST_TOKEN:-}
      - MEDIA_STORAGE_TOKEN=${MEDIA_STORAGE_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ============================================================================
  # Ollama 本地 LLM 服务 — Qwen2.5:1.8b
  # 启用：docker compose --profile ai up -d
  #       或 docker compose --profile full up -d
  # ----------------------------------------------------------------------------
  ollama:
    profiles: ["ai", "full"]
    image: docker.m.daocloud.io/ollama/ollama:latest
    container_name: super-note-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    entrypoint: /bin/sh
    command:
      - -c
      - |
        /bin/ollama serve &
        sleep 3
        echo "Pulling Qwen2.5:1.8b..."
        # Qwen2.5:1.8b（默认，~1.1GB，适合 4GB 内存设备）
        /bin/ollama pull qwen2.5:1.8b 2>&1
        # Qwen2.5:7b（可选，~4.7GB，需要 8GB+ 内存；取消下行注释启用）
        # /bin/ollama pull qwen2.5:7b 2>&1
        /bin/ollama pull bge-small-zh 2>&1
        echo "Models ready!"
        wait
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2048M

  # ============================================================================
  # Redis — 多实例广播 / AI 异步任务队列
  # 启用：docker compose --profile ai up -d
  #       或 docker compose --profile full up -d
  # 启用后请在 .env 设置：REDIS_URL=redis://redis:6379
  # 注意：默认不暴露宿主机 6379，避免未授权访问。
  # ----------------------------------------------------------------------------
  redis:
    profiles: ["ai", "full"]
    image: docker.m.daocloud.io/redis:7-alpine
    container_name: super-note-redis
    restart: unless-stopped
    # 仅容器网络内可达；需要宿主机调试时再取消 ports 注释
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # OpenList 网盘挂载（媒体库）
  # 启用：docker compose --profile media up -d
  #       或 docker compose --profile full up -d
  # 启用后请在 .env 设置 OPENLIST_URL / MEDIA_STORAGE_URL 等
  # ----------------------------------------------------------------------------
  openlist:
    profiles: ["media", "full"]
    image: docker.m.daocloud.io/openlistteam/openlist:latest
    container_name: super-note-openlist
    restart: unless-stopped
    ports:
      - "5244:5244"
    user: ${UID:-501}:${GID:-20}
    volumes:
      - ./openlist-data:/opt/openlist/data
    environment:
      - UMASK=022
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  super-note-data:
    driver: local
  # 启用独立备份卷时取消下方注释（与上面 volumes 段对应）：
  # super-note-backup:
  #   driver: local

  ollama-data:
    driver: local
  redis-data:
    driver: local
