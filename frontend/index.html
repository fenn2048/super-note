<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- 设置 Referrer Policy，使得跨域请求（如直接读取网盘视频、图片直链）不携带 Referer，规避防盗链拦截 -->
    <meta name="referrer" content="same-origin" />
    <!-- Favicon：蜉蝣品牌标 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/brand/fuyou-icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 使用系统字体栈，并引入霞鹜文楷屏幕版中文字体 -->
    <link rel="stylesheet" href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.6.0/lxgwwenkaiscreen.css" />
    <title>蜉蝣</title>
    <!--
      FOUC 防护：在 React 挂载前同步读取皮肤偏好并写入 <html data-skin="...">。
      next-themes 已处理明暗模式的首帧闪烁；此脚本只负责 skin 维度。
      注意：必须是同步内联脚本，不能放到外部文件，否则会被 <link modulepreload> 抢占在前。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("super-note-theme");
          if (!t || t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }

          var s = localStorage.getItem("super-note-skin");
          if (s && s !== "obsidian") {
            document.documentElement.setAttribute("data-skin", s);
          }
        } catch (e) { /* 隐私模式 / localStorage 被禁：静默忽略，按默认皮肤渲染 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root" style="height:100vh;width:100vw;overflow:hidden;">
      <!-- 首屏加载占位符，由 React 挂载后自动替换 -->
      <div class="initial-loader">
        <div class="loader-content">
          <div class="spinner"></div>
          <p>正在加载蜉蝣...</p>
        </div>
      </div>
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100%;
          width: 100%;
          background-color: #F5F3EE;
          color: #1a1a1a;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
          transition: background-color 0.2s, color 0.2s;
        }
        .loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }
        .initial-loader p {
          margin: 0;
          font-size: 14px;
          color: #5a5a5a;
          user-select: none;
        }
        .dark .initial-loader {
          background-color: #1e1e1e;
          color: #dadada;
        }
        .dark .initial-loader p {
          color: #a6a6a6;
        }
        .spinner {
          width: 28px;
          height: 28px;
          border: 2px solid #6366f1;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
