<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- 设置 Referrer Policy，使得跨域请求（如直接读取网盘视频、图片直链）不携带 Referer，规避防盗链拦截 -->
    <meta name="referrer" content="same-origin" />
    <!-- Favicon：蜉蝣品牌标 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/brand/fuyou-icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>蜉蝣</title>
    <!--
      FOUC 防护：同步应用 light/dark（无多皮肤）。
      注意：必须是同步内联脚本。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("super-note-theme");
          if (!t || t === "system") {
            t = "light";
          }
          if (t === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
          // skins removed
          document.documentElement.removeAttribute("data-skin");
          try { localStorage.removeItem("super-note-skin"); } catch (_) {}
        } catch (e) { /* ignore */ }
      })();
    </script>
    <!--
      关键 CSS 必须在 head：强制刷新首帧 body 默认白底 + ~8px margin 会在左侧/顶部露出细白条；
      且 100vw 含滚动条宽度易横向溢出。用 100%（非 100vw）+ 与产品一致的底色。
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f3efe6;
      }
      html.dark, html.dark body {
        background-color: #16131c;
      }
      #root {
        height: 100%;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        background-color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 首屏加载占位符，由 React 挂载后自动替换 -->
      <div class="initial-loader">
        <div class="loader-content">
          <div class="spinner"></div>
          <p>正在加载蜉蝣...</p>
        </div>
      </div>
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100%;
          width: 100%;
          background-color: #f3efe6;
          color: #1a1a1a;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
          transition: background-color 0.2s, color 0.2s;
        }
        .loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }
        .initial-loader p {
          margin: 0;
          font-size: 14px;
          color: #5a5a5a;
          user-select: none;
        }
        .dark .initial-loader {
          background-color: #16131c;
          color: #dadada;
        }
        .dark .initial-loader p {
          color: #a6a6a6;
        }
        .spinner {
          width: 28px;
          height: 28px;
          border: 2px solid #6366f1;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
