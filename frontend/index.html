<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon：品牌蓝 + 白色笔记 + N 字母，替代 Vite 默认图标 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 老旧浏览器回退到品牌 PNG logo -->
    <link rel="alternate icon" type="image/svg+xml" href="/super-note-icon.svg" />
    <!-- iOS 添加到主屏幕 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <!-- 品牌主题色（地址栏/PWA） -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 使用系统字体栈，避免依赖 Google Fonts CDN（国内 Android 设备可能加载超时） -->
    <title>ark-notes</title>
    <!--
      FOUC 防护：在 React 挂载前同步读取皮肤偏好并写入 <html data-skin="...">。
      next-themes 已处理明暗模式的首帧闪烁；此脚本只负责 skin 维度。
      注意：必须是同步内联脚本，不能放到外部文件，否则会被 <link modulepreload> 抢占在前。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("super-note-theme");
          if (!t || t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }

          var s = localStorage.getItem("super-note-skin");
          if (s && s !== "obsidian") {
            document.documentElement.setAttribute("data-skin", s);
          }
        } catch (e) { /* 隐私模式 / localStorage 被禁：静默忽略，按默认皮肤渲染 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root" style="height:100vh;width:100vw;overflow:hidden;">
      <!-- 首屏加载占位符，由 React 挂载后自动替换 -->
      <div class="initial-loader">
        <div class="loader-content">
          <div class="spinner"></div>
          <p>正在加载应用...</p>
        </div>
      </div>
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100%;
          width: 100%;
          background-color: #ffffff;
          color: #1a1a1a;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
          transition: background-color 0.2s, color 0.2s;
        }
        .loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }
        .initial-loader p {
          margin: 0;
          font-size: 14px;
          color: #5a5a5a;
          user-select: none;
        }
        .dark .initial-loader {
          background-color: #1e1e1e;
          color: #dadada;
        }
        .dark .initial-loader p {
          color: #a6a6a6;
        }
        .spinner {
          width: 28px;
          height: 28px;
          border: 2px solid #6366f1;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
