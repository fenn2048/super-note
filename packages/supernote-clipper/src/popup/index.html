<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>蜉蝣剪藏</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="header-left">
          <img src="../icons/icon-32.png" class="logo" alt="" />
          <h1>蜉蝣剪藏</h1>
        </div>
        <div class="header-right">
          <span id="connection-badge" class="badge err">未连接</span>
          <button type="button" id="toggle-config" class="icon-btn" title="服务器与令牌">⚙️</button>
        </div>
      </header>

      <!-- 当前页 -->
      <div class="section-card page-preview-card">
        <label class="muted-label">正在剪藏</label>
        <div id="page-title" class="page-title">读取标题…</div>
      </div>

      <!-- 配置：默认折叠；未连接时强制展开 -->
      <div id="config-section" class="section-card config-section hidden">
        <p class="hint-line">
          推荐使用<strong>访问令牌</strong>（设置 → 访问令牌，前缀 <code>nkn_</code>）。长期有效，适合插件。
        </p>
        <div class="row">
          <label for="server-url">服务器地址</label>
          <input id="server-url" type="url" placeholder="https://note.example.com" autocomplete="off" />
        </div>
        <div class="row">
          <label for="api-token">访问令牌</label>
          <input id="api-token" type="password" placeholder="nkn_…" autocomplete="off" />
        </div>
        <p class="hint-line muted">
          也可用选项页「账号登录」拿 JWT（会过期）。
          <a href="#" id="open-options">打开完整设置</a>
        </p>
      </div>

      <!-- 保存目标 -->
      <div id="clip-settings-panel" class="section-card settings-section disabled">
        <div class="row-inline">
          <div class="row">
            <label for="workspace-select">工作区</label>
            <select id="workspace-select" disabled>
              <option value="">加载中…</option>
            </select>
          </div>
          <div class="row">
            <label for="notebook-select">保存至</label>
            <select id="notebook-select" disabled>
              <option value="__default__">📓 剪藏笔记</option>
              <option value="__diary__">💬 说说</option>
            </select>
          </div>
        </div>
        <label class="checkbox-label compact">
          <input type="checkbox" id="image-localization" checked />
          <span>图片上传到服务器</span>
        </label>
      </div>

      <!-- 主 CTA -->
      <div class="clip-actions">
        <button id="clip-article" class="btn primary" type="button" disabled>剪藏正文</button>
        <div class="clip-secondary">
          <button id="clip-selection" class="btn secondary" type="button" disabled>选区</button>
          <button id="toggle-more" class="btn secondary" type="button" disabled>更多 ▾</button>
        </div>
      </div>

      <!-- 更多模式（默认隐藏） -->
      <div id="more-panel" class="section-card more-panel hidden disabled">
        <div class="mode-select-container">
          <select id="clip-mode" disabled>
            <option value="simplified">简化（无图纯文本）</option>
            <option value="fullpage">完全克隆（离线 HTML）</option>
            <option value="screenshot">可视区域截图</option>
            <option value="fullScreenshot">整页截图</option>
          </select>
          <button id="clip-more" class="btn secondary small-btn" type="button" disabled>执行</button>
        </div>
        <p class="hint-line muted">截图 / 克隆较慢，失败时可改用「剪藏正文」。</p>
      </div>

      <!-- AI + 高级 -->
      <div id="advanced-panel" class="section-card advanced-section disabled">
        <label class="checkbox-label">
          <input type="checkbox" id="ai-enhance" />
          <span>AI 智能整理</span>
          <button type="button" id="ai-toggle-details" class="linkish">选项</button>
        </label>
        <div id="ai-details" class="ai-details hidden">
          <label class="ai-task"><input type="checkbox" data-task="summary" checked /><span>摘要</span></label>
          <label class="ai-task"><input type="checkbox" data-task="tags" checked /><span>标签</span></label>
          <label class="ai-task"><input type="checkbox" data-task="outline" /><span>大纲</span></label>
          <label class="ai-task"><input type="checkbox" data-task="title" /><span>重写标题</span></label>
          <div class="ai-mode-row">
            <span class="ai-mode-label">拼接</span>
            <select id="ai-mode" class="ai-mode-select">
              <option value="prepend">摘要置顶</option>
              <option value="append">摘要置尾</option>
              <option value="replace">仅 AI 产物</option>
            </select>
          </div>
        </div>

        <button type="button" class="advanced-header" id="toggle-advanced">
          <span>标签 / 备注</span>
          <span class="chevron">▾</span>
        </button>
        <div id="advanced-content" class="advanced-content hidden">
          <div class="row">
            <label for="tags">标签</label>
            <input id="tags" type="text" placeholder="逗号分隔，如：技术, 备忘" autocomplete="off" />
          </div>
          <div class="row">
            <label for="comment">备注</label>
            <textarea id="comment" rows="2" placeholder="可选备注…"></textarea>
          </div>
          <label class="checkbox-label compact">
            <input type="checkbox" id="quick-capture" />
            <span>快速捕捉（点图标直接剪正文）</span>
          </label>
        </div>
      </div>

      <div id="progress" class="progress hidden">
        <div class="spinner"></div>
        <span id="progress-text"></span>
      </div>

      <div id="result" class="result hidden"></div>

      <!-- 离线上传队列 -->
      <div id="queue-section" class="section-card queue-section hidden">
        <div class="queue-row">
          <label class="muted-label">待上传队列</label>
          <button type="button" id="queue-flush" class="btn-link queue-flush">立即同步</button>
        </div>
        <p id="queue-status" class="hint-line muted">—</p>
      </div>

      <!-- 最近 -->
      <div id="history-section" class="section-card history-section">
        <label class="muted-label">最近剪藏</label>
        <ul id="history-list" class="history-list">
          <li class="muted">暂无记录</li>
        </ul>
      </div>

      <footer class="footer">
        <a href="#" id="footer-options">设置</a>
        <span class="sep">·</span>
        <span class="kbd-hint" title="可在 chrome://extensions/shortcuts 修改">Alt+Shift+S 正文 · A 选区</span>
      </footer>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
